services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: devmind
      POSTGRES_USER: devmind
      POSTGRES_PASSWORD: devmind
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devmind -d devmind"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

